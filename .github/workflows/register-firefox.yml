name: Register RoboForm account — Firefox (Selenium)

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email for a new RoboForm account
        required: true
        type: string
      full_name:
        description: Full name for the account
        required: false
        default: David Nguyen
        type: string
      privacy_consent:
        description: Agree to RoboForm Firefox Privacy terms (uncheck to decline)
        required: true
        type: boolean
        default: true
      ddddocr_hint:
        description: Include read-only ddddocr hint in the GitHub human verification Issue
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write # Temporary human CAPTCHA review Issue (no new PAT required)

# Prevent two separate browser workflows from racing to write the same CSV.
concurrency:
  group: roboform-registration
  cancel-in-progress: false

jobs:
  signup-firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REGISTRATION_EMAIL: ${{ inputs.email }}
      REGISTRATION_FULL_NAME: ${{ inputs.full_name }}
      FIREFOX_PRIVACY_CONSENT: ${{ inputs.privacy_consent }}
      ROBOFORM_MASTER_PASSWORD: ${{ secrets.ROBOFORM_MASTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Validate required inputs (never print credentials)
        shell: bash
        run: |
          if [[ "$FIREFOX_PRIVACY_CONSENT" != "true" ]]; then
            echo "::error title=Privacy consent required::Review the RoboForm Firefox Privacy agreement and select the consent checkbox to proceed."
            exit 1
          fi
          if [[ -z "${ROBOFORM_MASTER_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error title=Missing master password::Configure the ROBOFORM_MASTER_PASSWORD repository secret."
            exit 1
          fi
          if (( ${#ROBOFORM_MASTER_PASSWORD} < 16 )); then
            echo "::error title=Master password too short::Update the repository secret to a unique password of at least 16 characters."
            exit 1
          fi
          echo "Privacy authorization and password configuration validated; values are not logged."
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install Selenium and Tesseract
        run: |
          python -m pip install 'selenium>=4.30,<5'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install optional ddddocr model for human review
        if: ${{ inputs.ddddocr_hint }}
        run: python -m pip install 'ddddocr==1.6.1'
      - name: Test source and records
        run: |
          python -m py_compile scripts/firefox_support.py scripts/register-firefox.py scripts/analyze-verification-image.py scripts/github_captcha_review.py scripts/ddddocr-hint.py
          python -m unittest discover -s test -p 'test_register_firefox.py' -v
          python -m unittest discover -s test -p 'test_github_captcha_review.py' -v
          python -m unittest discover -s test -p 'test_ddddocr_hint.py' -v
          npm test
      - name: Register through official RoboForm Firefox extension
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          GITHUB_TOKEN: ${{ github.token }}
          ROBOFORM_GITHUB_CAPTCHA_REVIEW: 'true'
          ROBOFORM_DDDDOCR_ENABLED: ${{ inputs.ddddocr_hint }}
        run: python scripts/register-firefox.py
      - name: Upload original PNG verification screenshot (no ZIP)
        if: ${{ failure() }}
        id: verification_png
        uses: actions/upload-artifact@v7
        with:
          # v7 supports direct, non-archived single-file uploads.
          # The artifact name becomes firefox-verification-image.png.
          path: dist/firefox-verification-image.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7
      - name: Link original verification PNG in workflow summary
        if: ${{ failure() && steps.verification_png.outputs.artifact-url != '' }}
        env:
          IMAGE_URL: ${{ steps.verification_png.outputs.artifact-url }}
        run: |
          echo "### Firefox verification screenshot (original PNG)" >> "$GITHUB_STEP_SUMMARY"
          echo "[View or download PNG directly](${IMAGE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "Image captured by Selenium without post-processing; stored without ZIP compression." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit verified Firefox registration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registrations.csv
          if git diff --cached --quiet; then
            echo "No newly verified Firefox signup receipt generated."
            exit 1
          fi
          git commit -m "data: record verified RoboForm Firefox signup"
          git push origin HEAD:main
