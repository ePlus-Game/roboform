name: Register RoboForm account (Playwright)

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email for a new RoboForm account
        required: true
        type: string
      full_name:
        description: Full name for the account
        required: false
        default: David Nguyen
        type: string

permissions:
  contents: write

concurrency:
  group: roboform-registration
  cancel-in-progress: false

jobs:
  signup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REGISTRATION_EMAIL: ${{ inputs.email }}
      REGISTRATION_FULL_NAME: ${{ inputs.full_name }}
      ROBOFORM_MASTER_PASSWORD: ${{ secrets.ROBOFORM_MASTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Validate RoboForm master password
        shell: bash
        run: |
          if [[ -z "${ROBOFORM_MASTER_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error title=Missing master password::ROBOFORM_MASTER_PASSWORD was not supplied or is blank. Check Settings > Secrets and variables > Actions."
            exit 1
          fi
          if (( ${#ROBOFORM_MASTER_PASSWORD} < 16 )); then
            echo "::error title=Master password too short::ROBOFORM_MASTER_PASSWORD was supplied but contains fewer than 16 characters. Update the repository secret."
            exit 1
          fi
          echo "Master password configuration validated (value not logged)."
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install RoboForm, submit signup, require success confirmation
        run: npm run register
      - name: Commit verified registration only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registrations.csv
          if git diff --cached --quiet; then
            echo "No newly verified signup receipt generated."
            exit 1
          fi
          git commit -m "data: record verified RoboForm signup"
          git push origin HEAD:main
