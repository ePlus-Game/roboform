name: Log RoboForm registration email

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email to add to the registration tracking log
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: roboform-registration-records
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record email without manual confirmation
        env:
          REGISTRATION_EMAIL: ${{ inputs.email }}
        run: node scripts/record-confirmed.mjs
      - name: Persist tracking log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registrations.csv
          git commit -m "data: log RoboForm email (unverified)"
          git push origin HEAD:main
