name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Firefox registration Python syntax
        run: python -m py_compile scripts/firefox_support.py scripts/register-firefox.py scripts/analyze-verification-image.py scripts/github_captcha_review.py scripts/review_content.py
      - name: Install Python test dependencies
        run: python -m pip install 'selenium>=4.30,<5'
      - name: Check image verification diagnostics (no registration)
        run: python -m unittest discover -s test -p 'test_*.py'

  smoke-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Load official RoboForm extension and locate Sign Up UI (no submission)
        run: npm run smoke
